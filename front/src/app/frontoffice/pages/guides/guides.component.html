<div class="guides-page py-5">
  <div class="container">
    <div class="row mb-5">
      <div class="col-12 text-center">
        <h2 class="font-weight-bold mb-3">Our Expert Guides</h2>
        <p class="text-muted">Meet our experienced guides who will lead your adventure.</p>
      </div>
    </div>

    <!-- Add Guide Button -->
    <div class="row mb-4">
      <div class="col-12 text-center">
        <button class="btn btn-success btn-lg" (click)="openForm()" *ngIf="!showForm">
          <i class="fas fa-plus mr-2"></i>Add New Guide
        </button>
      </div>
    </div>

    <!-- Add/Edit Form -->
    <div class="row mb-4" *ngIf="showForm">
      <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h5 class="card-title font-weight-bold mb-4">{{ isEditing ? 'Edit Guide' : 'Add New Guide' }}</h5>

            <div class="form-group mb-3">
              <label for="fullName" class="font-weight-bold">Full Name</label>
              <input type="text" id="fullName" class="form-control" [(ngModel)]="formData.fullName"
                     placeholder="Enter guide name">
            </div>

            <div class="form-group mb-3">
              <label for="experienceYears" class="font-weight-bold">Years of Experience</label>
              <input type="number" id="experienceYears" class="form-control" [(ngModel)]="formData.experienceYears"
                     placeholder="Enter years of experience" min="0">
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-success flex-fill" (click)="saveGuide()">
                <i class="fas fa-save mr-2"></i>{{ isEditing ? 'Update' : 'Create' }}
              </button>
              <button class="btn btn-outline-secondary flex-fill" (click)="closeForm()">
                <i class="fas fa-times mr-2"></i>Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Guides List -->
    <div class="row">
      <div class="col-lg-4 col-md-6 mb-4" *ngFor="let guide of guides">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body p-4">
            <h5 class="card-title font-weight-bold mb-2">{{ guide.fullName }}</h5>
            <p class="text-muted mb-3">
              <i class="fas fa-star text-warning mr-2"></i>
              <span class="badge badge-light">{{ guide.experienceYears }} years experience</span>
            </p>

            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-success flex-fill" (click)="editGuide(guide)">
                <i class="fas fa-edit mr-1"></i>Edit
              </button>
              <button class="btn btn-sm btn-danger flex-fill" (click)="deleteGuide(guide.guideId)">
                <i class="fas fa-trash-alt mr-1"></i>Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="text-center py-5" *ngIf="guides.length === 0 && !showForm">
      <i class="fas fa-users fa-3x text-muted mb-3"></i>
      <h5>No guides found. Create one to get started.</h5>
    </div>
  </div>
</div>
