<div class="login-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-lg-5 col-md-7">

        <!-- Login Card -->
        <div class="login-card">

          <!-- Logo Section -->
          <div class="text-center mb-4">
            <div class="login-logo mb-3">
              <i class="fas fa-campground"></i>
            </div>
            <h2 class="font-weight-bold mb-2">Reset Password</h2>
            <p class="text-muted">Enter your new password below.</p>
          </div>

          <!-- Invalid Token Alert State -->
          <div *ngIf="invalidToken" class="alert alert-danger text-center">
            <p>This reset link is invalid or missing. Please request a new one.</p>
            <a routerLink="/forgot-password" class="btn btn-outline-danger btn-sm mt-2">Go to Forgot Password</a>
          </div>

          <div *ngIf="!invalidToken">
            <!-- Success Alert -->
            <div *ngIf="success" class="alert alert-success mt-3">
              Password reset successfully! Redirecting to login...
            </div>

            <!-- Error Alert -->
            <div *ngIf="errorMsg" class="alert alert-danger mt-3">
              {{ errorMsg }}
            </div>

            <!-- Reset Password Form -->
            <form *ngIf="!success" (ngSubmit)="onSubmit()">

              <!-- New Password Input -->
              <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text">
                      <i class="fas fa-lock"></i>
                    </span>
                  </div>
                  <input [type]="showPassword ? 'text' : 'password'" class="form-control" name="newPassword" [(ngModel)]="newPassword"
                    placeholder="Enter new password" required>
                  <div class="input-group-append">
                    <button type="button" class="input-group-text" (click)="togglePassword()" style="border-left:none;cursor:pointer;background:#F5F0E8;border-color:#e9ecef;">
                      <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Confirm Password Input -->
              <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text">
                      <i class="fas fa-lock"></i>
                    </span>
                  </div>
                  <input [type]="showPassword ? 'text' : 'password'" class="form-control" name="confirmPassword" [(ngModel)]="confirmPassword"
                    placeholder="Confirm new password" required>
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-success btn-block btn-lg mb-3" [disabled]="loading || !newPassword || !confirmPassword">
                <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
                Reset Password
              </button>

            </form>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
