<div class="login-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-lg-5 col-md-7">

        <!-- Login Card -->
        <div class="login-card">

          <!-- Logo Section -->
          <div class="text-center mb-4">
            <div class="login-logo mb-3">
              <i class="fas fa-campground"></i>
            </div>
            <h2 class="font-weight-bold mb-2">Forgot Password?</h2>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
          </div>

          <!-- Success Alert -->
          <div *ngIf="submitted" class="alert alert-success mt-3">
            If this email is registered, a reset link has been sent to your inbox.
          </div>

          <!-- Error Alert -->
          <div *ngIf="errorMsg" class="alert alert-danger mt-3">
            {{ errorMsg }}
          </div>

          <!-- Forgot Password Form -->
          <form *ngIf="!submitted" (ngSubmit)="onSubmit()">

            <!-- Email Input -->
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                  </span>
                </div>
                <input type="email" class="form-control" name="email" [(ngModel)]="email"
                  placeholder="Enter your email" required>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-success btn-block btn-lg mb-3" [disabled]="loading || !email">
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
              Send Reset Link
            </button>

          </form>
          
          <!-- Back Link -->
          <div class="text-center mt-3">
             <a routerLink="/login" class="text-success font-weight-bold">← Back to Login</a>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
