gzip on;
gzip_types application/json text/html text/css application/javascript text/javascript;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://api.open-meteo.com; frame-src https://js.stripe.com;" always;

    # ── Spring Boot API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://spring-boot-app:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── WebSocket (Spring Boot) ───────────────────────────────────────────────
    location /ws {
        proxy_pass http://spring-boot-app:9099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Auth endpoints ────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://spring-boot-app:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Swagger (dev only — remove in prod) ──────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://spring-boot-app:9099;
        proxy_set_header Host $host;
    }

    # ── FastAPI AI service: internal only — BLOCKED from public ──────────────
    # The /ai/ prefix is never exposed externally.
    # Spring Boot talks directly to campsite-recommender:8001 on the Docker network.

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
