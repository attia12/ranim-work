name: AI Recommender CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_RECOMMENDER: ghcr.io/${{ github.repository_owner }}/campway-recommender
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/campway-backend

jobs:

  # ── Python tests ─────────────────────────────────────────────────────────
  test-python:
    name: Test FastAPI Recommender
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campsite-recommender
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: campsite-recommender/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

  # ── Java tests ───────────────────────────────────────────────────────────
  test-java:
    name: Test Spring Boot Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -B
        env:
          JWT_SECRET: ci-test-secret-key-minimum-32-chars!

  # ── Angular tests ────────────────────────────────────────────────────────
  test-angular:
    name: Test Angular Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # ── Build & push images (main only) ─────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-python, test-java, test-angular]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push FastAPI recommender
        uses: docker/build-push-action@v5
        with:
          context: ./campsite-recommender
          push: true
          tags: ${{ env.IMAGE_RECOMMENDER }}:latest,${{ env.IMAGE_RECOMMENDER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Spring Boot backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest,${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
