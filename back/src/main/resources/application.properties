spring.application.name=ProjetPiDev

spring.datasource.url=jdbc:mysql://localhost:3306/CampwayDB?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
app.jwt.secret=${JWT_SECRET:campway-dev-secret-key-must-be-32chars!}
app.jwt.expiration-ms=86400000
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.tn.esprit=INFO
spring.jpa.open-in-view=false
server.port=9099


# ===== SWAGGER / OPENAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.packages-to-scan=tn.esprit.projetpidev
springdoc.swagger-ui.display-request-duration=true

# ===== FIX OPEN-IN-VIEW WARNING =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.ddl-auto=update

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL for reset link
app.frontend.url=http://localhost:4200

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
