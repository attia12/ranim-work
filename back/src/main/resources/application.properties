spring.application.name=ProjetPiDev

spring.datasource.url=jdbc:mysql://localhost:3306/CampwayDB?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
app.jwt.secret=${JWT_SECRET:campway-dev-secret-key-must-be-32chars!}
app.jwt.expiration-ms=86400000
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.tn.esprit=INFO
spring.jpa.open-in-view=false
server.port=9099


# ===== SWAGGER / OPENAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.packages-to-scan=tn.esprit.projetpidev
springdoc.swagger-ui.display-request-duration=true

# ===== FIX OPEN-IN-VIEW WARNING =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.ddl-auto=update

# ===== MAILDEV (local dev email server) =====
# Start with: docker run -d -p 1080:1080 -p 1025:1025 maildev/maildev
# Web UI: http://localhost:1080
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=noreply@campway.dev
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Frontend URL for reset link
app.frontend.url=http://localhost:4200
