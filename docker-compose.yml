version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: campway-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: CampwayDB
    volumes:
      - campway_db_data:/var/lib/mysql
    restart: unless-stopped

  maildev:
    image: maildev/maildev
    container_name: campway-maildev
    ports:
      - "1025:1025"   # SMTP
      - "1080:1080"   # Web UI → http://localhost:1080
    restart: unless-stopped

volumes:
  campway_db_data:
