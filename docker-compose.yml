version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: campway-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: CampwayDB
    volumes:
      - campway_db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  campway_db_data:
