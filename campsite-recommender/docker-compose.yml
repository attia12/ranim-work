services:
  campsite-recommender:
    build: .
    ports:
      - "8001:8001"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:9099}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
